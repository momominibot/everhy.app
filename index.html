<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3e6d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ebb</title>
<link rel="stylesheet" href="css/ebb.css">
<!-- extension styles: each workstream owns one file; a missing file is harmless -->
<link rel="stylesheet" href="css/ext/log.css">
<link rel="stylesheet" href="css/ext/safety.css">
<link rel="stylesheet" href="css/ext/world.css">
<link rel="stylesheet" href="css/ext/course.css">
<link rel="stylesheet" href="css/ext/settings.css">
<link rel="stylesheet" href="css/ext/map.css">
<link rel="stylesheet" href="css/ext/sky.css">
<link rel="stylesheet" href="css/ext/sound.css">
<link rel="stylesheet" href="css/ext/bag.css">
<link rel="stylesheet" href="css/ext/atmosphere.css">
<link rel="stylesheet" href="css/ext/today.css">
<link rel="stylesheet" href="css/ext/live.css">
<link rel="stylesheet" href="css/ext/sleep.css">
<link rel="stylesheet" href="css/ext/routines.css">
<link rel="stylesheet" href="css/ext/transit.css">
<link rel="stylesheet" href="css/ext/seats.css">
</head>
<body>
<main class="app">
  <header class="top">
    <span class="place" id="place">Bedroom</span>
    <span class="counts" id="counts" aria-label="Your things"><!-- icon chips; the word stays for screen readers -->
      <span class="chip" title="Seeds" aria-label="Seeds"><i class="ico ico-seeds"></i><em class="sr">Seeds</em> <b id="hudSeeds">0</b></span>
      <span class="chip" title="Basket" aria-label="Basket"><i class="ico ico-basket"></i><em class="sr">Basket</em> <b id="hudBasket">0</b></span>
      <span class="chip" title="Offerings" aria-label="Offerings"><i class="ico ico-pond"></i><em class="sr">Pond</em> <b id="hudPond">0</b></span>
    </span>
    <button type="button" class="btn small" id="moreBtn" aria-haspopup="true">More</button>
    <nav class="menu" id="moreMenu" hidden aria-label="More"></nav>
  </header>
  <div class="scene" id="scene" aria-label="Game scene. Tap the floor to walk.">
    <div class="backdrop" id="backdrop" aria-hidden="true"></div>
    <div class="stage" id="stage"><!-- a square in scene percent; the camera moves it so she stays in view -->
      <img id="plate" alt="" draggable="false">
      <svg class="layer" id="layer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs><radialGradient id="halo"><stop offset="0" stop-color="#fff6d8" stop-opacity="0.9"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient></defs>
        <g id="props"></g>
        <g id="me"></g>
        <g id="front"></g>
        <g id="fx"></g>
      </svg>
    </div>
    <p class="toast" id="toast" role="status" hidden></p>
  </div>
  <div class="actionbar"><button type="button" class="prompt" id="prompt" hidden></button></div>
  <p class="hint">Tap the ground to walk. Tap things to use them.</p>
</main>
<script src="js/ebb-puppet.js"></script>
<script src="js/ebb-clay-sets.js"></script>
<script src="js/ebb-clay.js"></script>
<script src="js/ebb-world.js"></script>
<script src="js/ebb-farm.js"></script>
<script src="js/ebb-store.js"></script>
<script src="js/ebb-props.js"></script>
<script src="js/ebb-ui.js"></script>
<script src="js/ebb-game.js"></script>
<script src="js/ebb-life.js"></script>
<!-- extensions: each workstream owns one entry file and registers through EbbWorld / EbbGame; a missing file is harmless -->
<script src="js/ext/log.js"></script>
<script src="js/ext/safety.js"></script>
<script src="js/ext/world.js"></script>
<script src="js/ext/course.js"></script>
<script src="js/ext/settings.js"></script>
<script src="js/ext/map.js"></script>
<script src="js/ext/sky.js"></script>
<script src="js/ext/sound.js"></script>
<script src="js/ext/bag.js"></script>
<script src="js/ext/atmosphere.js"></script>
<script src="js/ext/today.js"></script>
<script src="js/ext/live.js"></script>
<script src="js/ext/sleep.js"></script>
<script src="js/ext/routines.js"></script>
<script src="js/ext/transit.js"></script>
<script src="js/ext/seats.js"></script>
</body>
</html>
